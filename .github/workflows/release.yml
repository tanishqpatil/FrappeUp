name: Release script CLI
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          sh -n frappeup install.sh lib/common.sh
          ./frappeup version
          ./frappeup catalog list > /dev/null
      - name: Package script bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tar -czf release/frappeup_unix.tar.gz frappeup lib/common.sh catalog/official-apps.env
          (cd release && sha256sum frappeup_unix.tar.gz > frappeup_unix.tar.gz.sha256)
          zip -q release/frappeup_windows.zip frappeup.ps1 frappeup.bat catalog/official-apps.env
          (cd release && sha256sum frappeup_windows.zip > frappeup_windows.zip.sha256)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes
