name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build release

          build_unix() {
            local os="$1"
            local arch="$2"
            local asset="frappe1tap_${os}_${arch}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "build/frappe1tap" ./cmd/frappe1tap
            tar -C build -czf "release/${asset}.tar.gz" frappe1tap
            (cd release && sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256")
          }

          build_unix linux amd64
          build_unix linux arm64
          build_unix darwin amd64
          build_unix darwin arm64

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o build/frappe1tap.exe ./cmd/frappe1tap
          (cd build && zip -q ../release/frappe1tap_windows_amd64.zip frappe1tap.exe)
          (cd release && sha256sum frappe1tap_windows_amd64.zip > frappe1tap_windows_amd64.zip.sha256)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes
